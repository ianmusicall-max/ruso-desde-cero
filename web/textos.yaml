    escritura: [Escritura, Escribe tu nombre en cirílico.]
    habla: [Conversación, Practica cómo presentarte en ruso.]
  # Las cuatro pruebas de la portada. El ruso no está aquí: vive una sola vez
  # en construir_sitio.py, porque las dos pistas lo comparten. Aquí va lo que
  # cambia de lengua a lengua, y las listas tienen que seguir el mismo orden
  # y la misma longitud que las de allí.
  pruebas:
    paginas: {lectura: prueba-lectura.html, escritura: prueba-escritura.html, escucha: prueba-escucha.html, habla: prueba-habla.html}
    dura: Dos minutos, aquí mismo. No hace falta saber nada de ruso.
    volver: Portada
    de_dia: "Esto sale del día {dia} del curso."
    ver_leccion: Ver la lección entera
    otras: Las otras pruebas
    lectura:
      titulo: Lee tus primeras palabras en ruso
      intro: >-
        El alfabeto ruso tiene 33 letras, y **cinco se escriben y se leen
        igual que en español**. Con esas cinco ya se leen palabras de verdad.
      cab: [Letra, Suena, Como en]
      letras: [[a, "**a**mor"], [o, "**o**so"], [k, "**c**asa"], [m, "**m**amá"], [t, "**t**omate"]]
      pide: Lee cada palabra en voz alta y tócala para comprobar.
      palabras: [[kot, gato], [tam, allí], [tak, así], [kak, cómo], [kto, quién], ["**MA**-ma", mamá]]
      frase: "Y con cuatro de ellas se lee una conversación entera. Alguien llama a la puerta:"
      puerta: ["¿Quién es?", "Mamá."]
      cierre: >-
        Seis palabras y una conversación en dos minutos. Fíjate en lo que
        **no** hay: **Там кот** son dos palabras y significa «allí está el
        gato». El ruso no tiene artículos y en presente no dice «es» ni
        «está».
    escritura:
      titulo: Escribe tu nombre en cirílico
      intro: >-
        Aquí están las 33 letras con su sonido. Toca las que necesites y
        escribe tu nombre **como suena**, no como se escribe. La **Х** suena
        como nuestra j y la **Р** es una r, así que José se escribe **Хосе́** y
        Jorge, **Хо́рхе**.
      alfabeto:
        - "a"
        - "b"
        - "v"
        - "g (de «gato»)"
        - "d"
        - "ye, e"
        - "yo"
        - "la ll de Buenos Aires"
        - "z sonora, la s de «mismo»"
        - "i"
        - "y corta, de «hoy»"
        - "k"
        - "l"
        - "m"
        - "n"
        - "o"
        - "p"
        - "r"
        - "s"
        - "t"
        - "u"
        - "f"
        - "j"
        - "ts"
        - "ch"
        - "sh"
        - "sh larga y blanda"
        - "signo duro: no suena"
        - "una i con la lengua atrás"
        - "signo blando: ablanda"
        - "e"
        - "yu"
        - "ya"
      etiqueta: Tu nombre en ruso
      hueco: Toca las letras
      borrar: Borrar la última
      vaciar: Vaciar
      ejemplos: "Los cuatro personajes del curso, por si te sirven de modelo:"
      cierre: >-
        La tilde marca la sílaba fuerte y en Rusia no se escribe; en este
        curso la vas a ver siempre, porque en ruso el acento no se adivina y
        si cambia de sitio, cambia la palabra.
    escucha:
      titulo: La pregunta rusa no sube al final
      intro: >-
        En ruso, una pregunta de sí o no **tiene exactamente las mismas
        palabras que la respuesta**. Lo único que cambia es la voz. Mira por
        dónde sube:
      afirmacion: Afirmación
      pregunta: Pregunta
      pares: [["Es un gato.", "¿Es un gato?"], ["Es una habitación.", "¿Es una habitación?"]]
      contraste: >-
        **Ahí está la trampa.** En español la voz sube al final de la frase y
        se queda arriba: «¿es una habitación↗?». En ruso sube **en la sílaba
        con acento** de la palabra que preguntas, y lo que viene detrás baja.
        Con **кот** las dos lenguas coinciden, porque la tónica es la última;
        con **ко́мната** ya no.
      graba_pide: Dilo tú. Grábate y escucha si tu voz sube donde tiene que subir.
      sin_permiso: >-
        No se pudo usar el micrófono. Dilo en voz alta igual: la prueba
        funciona sin grabar nada.
      graba: Grabarme
      para: Parar
      cierre: >-
        Son dos frases, pero la entonación es la mitad de lo que hace que te
        entiendan: si subes al final, como en español, se entiende, pero
        suena a extranjero.
    habla:
      titulo: Preséntate en ruso
      intro: >-
        Tu primera conversación, la que vas a usar el primer día que pongas
        un pie en Rusia. Escribe tu nombre y dila entera, las dos voces, en
        voz alta.
      etiqueta: Tu nombre
      hueco: Camila
      lineas: ["¡Hola! ¿Cómo te llamas?", "Me llamo {nombre}. ¿Y tú?", "Kira.", "¡Mucho gusto!"]
      cab: [Frase, Se dice, Significa]
      frases:
        - ["kak ti-**BIA** za-**VUT**", "¿Cómo te llamas?"]
        - ["mi-**ÑA** za-**VUT**", "Me llamo…"]
        - ["a ti-**BIA**", "¿Y tú?"]
        - ["**O**-chin pri-**YAT**-na", "Mucho gusto."]
      cierre: >-
        Esta es la forma de **tú**, la de los amigos, la gente de tu edad y
        los niños. La de usted llega en la unidad 3, y cuál de las dos usar
        es una de las cosas que el español no te prepara para decidir.
