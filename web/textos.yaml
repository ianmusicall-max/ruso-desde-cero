    titulo: Explore Russian
    escucha: [Listening, Record yourself and listen to your intonation.]
    lectura: [Reading, Read your first words aloud.]
    escritura: [Writing, Write your name in Cyrillic.]
    habla: [Speaking, Practise introducing yourself in Russian.]
  # The four tasters linked from the home page. The Russian is not here: it
  # lives once in construir_sitio.py, because both tracks share it. What
  # changes from language to language goes here, and the lists must keep the
  # same order and the same length as the ones over there.
  pruebas:
    paginas: {lectura: try-reading.html, escritura: try-writing.html, escucha: try-listening.html, habla: try-speaking.html}
    dura: Two minutes, right here. You need to know no Russian at all.
    volver: Home
    de_dia: "This comes from day {dia} of the course."
    ver_leccion: See the whole lesson
    otras: The other tasters
    lectura:
      titulo: Read your first words in Russian
      intro: >-
        The Russian alphabet has 33 letters, and **five of them are written
        and read exactly as in English**. Those five already spell real
        words.
      cab: [Letter, Sounds, As in]
      letras: [[a, "f**a**ther"], [o, "**o**r (short, no glide)"], [k, "s**k**ate"], [m, "**m**um"], [t, "s**t**op"]]
      pide: Read each word aloud, then tap it to check.
      palabras: [[kot, cat], [tam, there], [tak, "so, like this"], [kak, how], [kto, who], ["**MA**-ma", mum]]
      frase: "And four of them already spell a whole conversation. Someone knocks at the door:"
      puerta: ["Who is it?", "Mum."]
      cierre: >-
        Six words and a conversation in two minutes. And look at what is
        **missing**: **Там кот** is two words and means “the cat is there”.
        Russian has no articles, and in the present it doesn't say “is”.
    escritura:
      titulo: Write your name in Cyrillic
      intro: >-
        Here are all 33 letters with their sound. Tap the ones you need and
        write your name **the way it sounds**, not the way it's spelt. **Дж**
        is the j of *jam* and **Х** is the ch of *loch*, so John is **Джон**
        and Hugh is **Хью**.
      alfabeto:
        - "a (father)"
        - "b"
        - "v"
        - "g (go)"
        - "d"
        - "ye, e"
        - "yo"
        - "zh, the s in measure"
        - "z"
        - "i (meet)"
        - "y, as in boy"
        - "k"
        - "l"
        - "m"
        - "n"
        - "o"
        - "p"
        - "rolled r"
        - "s"
        - "t"
        - "oo"
        - "f"
        - "kh, as in loch"
        - "ts, as in cats"
        - "ch"
        - "sh"
        - "long soft sh"
        - "hard sign: silent"
        - "a deep i, tongue pulled back"
        - "soft sign: softens"
        - "e (bed)"
        - "yu (you)"
        - "ya (yard)"
      etiqueta: Your name in Russian
      hueco: Tap the letters
      borrar: Delete last
      vaciar: Clear
      ejemplos: "The four characters of the course, as a model:"
      cierre: >-
        The mark over a vowel is the stress, and in Russia it isn't written;
        in this course you'll see it on every word, because Russian stress
        can't be guessed, and if it moves, the word changes.
    escucha:
      titulo: A Russian question doesn't rise at the end
      intro: >-
        In Russian a yes-or-no question has **exactly the same words as the
        answer**. The only thing that changes is your voice. Watch where it
        goes up:
      afirmacion: Statement
      pregunta: Question
      pares: [["It's a cat.", "Is it a cat?"], ["It's a room.", "Is it a room?"]]
      contraste: >-
        **That's the trap.** In English your voice rises at the end of the
        question and stays up: “is it a room↗?”. In Russian it jumps up **on
        the stressed syllable** of the word you're asking about, and
        everything after it drops. With **кот** both languages agree, because
        the stress is on the last syllable; with **ко́мната** they don't.
      graba_pide: Now you. Record yourself and listen for whether your voice rises where it should.
      sin_permiso: >-
        The microphone isn't available. Say it out loud anyway: the taster
        works without recording a thing.
      graba: Record me
      para: Stop
      cierre: >-
        Two sentences, but intonation is half of being understood: if you
        rise at the end, as in English, you'll be understood — and you'll
        sound foreign.
    habla:
      titulo: Introduce yourself in Russian
      intro: >-
        Your first conversation, the one you'll use on your first day in
        Russia. Type your name and say the whole thing out loud, both voices.
      etiqueta: Your name
      hueco: Tom
      lineas: ["Hi! What's your name?", "My name's {nombre}. And yours?", "Kira.", "Nice to meet you!"]
      cab: [Phrase, Say it, Means]
      frases:
        - ["kak ti-**BYA** za-**VOOT**", "What's your name?"]
        - ["mi-**NYA** za-**VOOT**", "My name is…"]
        - ["a ti-**BYA**", "And yours?"]
        - ["**O**-chin pri-**YAT**-na", "Nice to meet you."]
      cierre: >-
        This is the **informal** form, for friends, people your age and
        children. The polite one arrives in unit 3, and choosing between them
        is one of the things English doesn't prepare you for.
