  unidades_de: unidades
  lecciones_listas: lecciones escritas
  ver_unidad: Ver las lecciones
  portada: |
    ## Qué es

    Un curso de ruso completo y gratuito que va **del alfabeto al nivel B2**:
    cuatro niveles de 365 lecciones, una por día, de **treinta minutos**.
    A una lección diaria, un nivel por año; a dos, B2 en dos años.

    Está escrito **para hispanohablantes**. Cada lección te dice dónde el
    español te ayuda —la erre, la ch, el género, «me gusta», la doble
    negación— y qué error te va a hacer cometer, **antes** de que lo cometas.

    ## Cómo es una lección

    Treinta minutos con reloj, en seis partes: **calentamiento** con lo de
    días anteriores, **fonética**, **lo nuevo**, **práctica**, **tu turno**
    —hablar o escribir tú— y **cierre**. Todas las palabras rusas llevan
    marcada la sílaba tónica, que en ruso no se puede adivinar. Las
    respuestas están debajo de cada ejercicio, plegadas.

    ## Hecho para estudiar solo

    Los manuales de ruso están pensados para una clase con profesor: la
    mitad de sus tareas son «trabajen en parejas». Aquí cada tarea tiene su
    versión para una persona sola, con un modelo que escuchar y tu parte
    para decir en voz alta.

    ## En qué punto está

    El curso se está escribiendo y se publica a medida que avanza: hoy hay
    **{lecciones}** lecciones disponibles. Las que llevan el aviso de
    borrador todavía no pasaron la revisión final.
  sobre: |
    ## El curso

    Cuatro niveles —**A1, A2, B1 y B2**— de 365 lecciones cada uno. Cada
    nivel tiene 24 unidades de dos semanas, cuatro semanas finales de
    simulacros del examen del nivel y un día de reserva. Dentro de cada
    semana hay cinco lecciones, un repaso o una prueba de unidad, y un
    domingo de cultura.

    El orden de los contenidos sigue la secuencia habitual de los manuales
    de ruso para extranjeros y los niveles de los exámenes oficiales de
    ruso como lengua extranjera (ТРКИ / TORFL). El curso no tiene ninguna
    relación con los organismos que administran esos exámenes.

    ## Dos versiones, el mismo ruso

    El curso existe en español y en inglés. El ruso —los textos, los
    diálogos, los ejemplos— es el mismo en las dos; lo que cambia es la
    explicación y, sobre todo, **el contraste**: los errores de un
    hispanohablante no son los de un angloparlante.

    ## Quién lo hace

    Lo dirige un profesor de idiomas hispanohablante. Cada lección se revisa
    contra manuales de referencia; las que todavía no pasaron la revisión
    final del ruso llevan el aviso de **borrador**.

    ## Gratis

    El curso es gratuito y no pide registrarse. Si algún día lleva
    publicidad, la [política de privacidad](privacidad.html) lo dirá antes.
  contacto: |
    ## Contacto

    {correo}

    Si encuentras un error en una lección —una palabra mal acentuada, una
    respuesta que no cuadra— escribe la dirección de la página y qué viste.
    Cada error que llega se corrige en todas las lecciones donde aparece.
  sin_correo: El correo de contacto se publicará en esta página muy pronto.
  privacidad: |
    ## Política de privacidad

    **Este sitio no usa cookies y no recoge datos personales.**

    - **Tu progreso** (las lecciones que marcas como hechas y la última que
      abriste) y **el tema claro u oscuro** se guardan en el almacenamiento
      local de tu navegador. No salen de tu aparato y no los vemos. Puedes
      borrarlos cuando quieras borrando los datos del sitio en tu navegador.
    - **No se carga nada de terceros**: ni publicidad, ni analítica, ni
      tipografías externas. Las fuentes se sirven desde este mismo dominio.
    - El sitio se aloja en GitHub Pages, que como cualquier servidor puede
      registrar la dirección IP de las visitas por motivos de seguridad.

    Si algún día el sitio incorpora publicidad o estadísticas, esta página
    lo dirá antes, con lo que se carga y cómo desactivarlo.

