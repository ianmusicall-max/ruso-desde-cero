  portada: |
    ## What it is

    A complete, free Russian course that goes **from the alphabet to B2**:
    four levels of 365 lessons, one a day, **thirty minutes** each. At one
    lesson a day, one level a year; at two, B2 in two years.

    It's written **for English speakers**. Every lesson tells you where
    English helps — sh, ch, the *s* in *measure*, vowels that already
    reduce — and which mistake it's going to make you make, **before** you
    make it.

    ## What a lesson looks like

    Thirty minutes on the clock, in six parts: a **warm-up** with earlier
    words, **pronunciation**, **something new**, **practice**, **your
    turn** — speaking or writing yourself — and a **wrap-up**. Every
    Russian word has its stressed syllable marked, because in Russian you
    can't guess it. The answers sit folded under each exercise.

    ## Built for studying alone

    Russian textbooks are written for a classroom: half their tasks say
    "work in pairs". Here every task has a version for one person, with a
    model to listen to and your part to say out loud.

    ## Where it stands

    The course is being written and published as it grows: there are
    **{lecciones}** lessons available today. The ones marked as drafts
    haven't had their final review yet.
  sobre: |
    ## The course

    Four levels — **A1, A2, B1 and B2** — of 365 lessons each. Every level
    has 24 two-week units, four final weeks of mock exams for that level,
    and a spare day. Each week brings five lessons, a review or a unit test,
    and a culture day on Sunday.

    The order follows the usual sequence of Russian textbooks for foreigners
    and the levels of the official Russian-as-a-foreign-language exams
    (ТРКИ / TORFL). The course has no connection with the bodies that run
    those exams.

    ## Two versions, the same Russian

    The course exists in English and in Spanish. The Russian — texts,
    dialogues, examples — is the same in both; what changes is the
    explanation and, above all, **the contrast**: an English speaker's
    mistakes aren't a Spanish speaker's.

    ## Who makes it

    It's run by a language teacher. Every lesson is checked against
    reference textbooks; the ones that haven't had their final Russian
    review yet are marked as **drafts**.

    ## Free

    The course is free and needs no sign-up. If it ever carries ads, the
    [privacy policy](privacy.html) will say so first.
  contacto: |
    ## Contact

    {correo}

    If you spot a mistake in a lesson — a wrongly stressed word, an answer
    that doesn't add up — send the page address and what you saw. Every
    mistake reported gets fixed in every lesson where it appears.
  sin_correo: The contact email will be published on this page very soon.
  privacidad: |
    ## Privacy policy

    **This site uses no cookies and collects no personal data.**

    - **Your progress** (the lessons you mark as done and the last one you
      opened) and **the light or dark theme** are kept in your browser's
      local storage. They never leave your device and we never see them.
      You can delete them at any time by clearing this site's data in your
      browser.
    - **Nothing is loaded from third parties**: no ads, no analytics, no
      external fonts. The fonts are served from this same domain.
    - The site is hosted on GitHub Pages, which like any server may log
      visitors' IP addresses for security purposes.

    If the site ever adds ads or statistics, this page will say so first,
    with what gets loaded and how to turn it off.
